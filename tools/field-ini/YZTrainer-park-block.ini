[General]
; YZTrainer 现场用 ini 模板（v0.6.47）：默认模板 45 + 0x40「只拦归位」
; 两者关系：本文件与 YZTrainer.ini 都是 Flags=109，内容等价 —— 主模板请用 YZTrainer.ini（注释更细）；
; 0x40 = 只丢弃「同一个目标点在 1 秒内被调用 >=8 次」的 SetCursorPos（把光标摁回角落那种），
;       教师端的正常遥控/协助**保留**（0x10 那种「全丢」才连协助一起废掉）。
; 用法：拷到 YZTrainer.exe 同目录并改名为 YZTrainer.ini。
; Flags = 窗口化(1) | 键鼠解锁(4) | 防监视/冻结(8) | 假全屏(32) | 只拦归位(64) = 109
Flags=109
WindowPercent=60
LogLevel=3
AutoInject=1
InjectMethod=0
EnableExamGuard=1
ExternalWindowFix=0
BlockMessageHooks=1
; 现场判读冻结需要取证钩子（会打 [DXGI 取证] 取帧统计），默认关，现场建议开
TraceDesktopDuplication=1
; 抓屏子进程自动注入 + 冻结落点
InjectCaptureChild=1
; 广播/采集时静默导诊断包；退出时不导（退出导出只在专门测那条路径时开）
AutoExportOnBroadcast=1
AutoExportOnCapture=1
AutoExportOnExit=0
; 采集栈监控扫描周期：现场保持默认 30000（调小只是回归提速用）
CaptureScanIntervalMs=30000
ProcessNames=Yistart.exe;TEACHCMD.exe;PlayerGUI.exe;ExdPaintHelper.exe