; ============================================================================
; YZTrainer 现场模板 · 光标自由变体（Flags=61 = 45 | 0x10）
;
; 与同目录 YZTrainer.ini（Flags=45）唯一差别：多了 0x10 拦截教师端遥控输入。
; 0x10 一开，学生端进程内所有 SetCursorPos / mouse_event / SendInput / keybd_event 都被直接丢弃
;   => 锁键鼠期间光标不再被反复摁回角落（2026-10-16 本机 A/B：y=0 采样占比 51% -> 0%）。
; 代价：教师端的遥控 / 远程协助也会一起被挡掉，会影响正常上课协助
;   => 只在专门验证“光标能否自由移动”时用这一份。
; 用法：整个覆盖到 <盘符>:\YZ\Win32\YZTrainer.ini（启动程序之前）。
; 本文件必须 UTF-8 无 BOM，否则整份配置会静默失效。
; ============================================================================
[General]
; YZTrainer 现场用 ini 模板（v0.6.40）
; 用法：拷到 YZTrainer.exe 同目录并改名为 YZTrainer.ini。
; Flags = 窗口化(1) | 键鼠解锁(4) | 防监视/冻结(8) | 假全屏(32) = 45
Flags=61
WindowPercent=60
LogLevel=3
AutoInject=1
InjectMethod=0
EnableExamGuard=1
ExternalWindowFix=0
BlockMessageHooks=1
; 现场判读冻结需要取证钩子（会打 [DXGI 取证] 取帧统计），默认关，现场建议开
TraceDesktopDuplication=1
; 抓屏子进程自动注入 + 冻结落点
InjectCaptureChild=1
; 广播/采集时静默导诊断包；退出时不导（退出导出只在专门测那条路径时开）
AutoExportOnBroadcast=1
AutoExportOnCapture=1
AutoExportOnExit=0
; 采集栈监控扫描周期：现场保持默认 30000（调小只是回归提速用）
CaptureScanIntervalMs=30000
ProcessNames=Yistart.exe;TEACHCMD.exe;PlayerGUI.exe;ExdPaintHelper.exe